name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Test
        run: npm test

      - name: Self-audit (lint:self) — must report zero CRITICAL/HIGH
        run: |
          if npm run lint:self -- --severity-floor HIGH; then
            echo "shellguard self-audit clean"
          else
            echo "::error::self-audit found HIGH or CRITICAL findings"
            exit 1
          fi

  smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Inspector smoke
        run: npm run inspect:smoke

  publish:
    runs-on: ubuntu-latest
    needs: [build-test, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - name: Pack tarball for attestation
        id: pack
        run: |
          TARBALL=$(npm pack --silent)
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
      - name: Generate Sigstore build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Publish with provenance
        run: npm publish --provenance --access public ${{ steps.pack.outputs.tarball }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
